name: Check CLI-Hub Registry

on:
  pull_request:
    paths:
      - 'registry.json'
      - 'public_registry.json'
      - 'cli-hub/**'
      - 'skills/**'
      - '**/agent-harness/**/skills/**'
      - '.github/workflows/check-cli-hub-registry.yml'
  push:
    branches:
      - main
    paths:
      - 'registry.json'
      - 'public_registry.json'
      - 'cli-hub/**'
      - 'skills/**'
      - '**/agent-harness/**/skills/**'
      - '.github/workflows/check-cli-hub-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CLI-Hub and test dependencies
        run: python -m pip install -e ./cli-hub pytest

      - name: Run CLI-Hub tests including registry checks
        run: python -m pytest cli-hub/tests -q
